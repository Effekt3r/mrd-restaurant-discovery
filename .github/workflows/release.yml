name: Release

# Builds the signed release APK for a v* tag and attaches it to a GitHub Release. The signing secrets live only on the
# `release` environment, whose deployment policy allows v* tags alone, so pull requests and branches never see them.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    # Writes only to create the GitHub Release. Everything else in this repository's workflows is read-only, apart
    # from dependency submission's submit job.
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Release builds read the cache dev and master wrote, and never write it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Decode the upload keystore
        env:
          MRD_KEYSTORE_BASE64: ${{ secrets.MRD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$MRD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload.jks"

      # The secrets go in as environment variables, not -P arguments, which would show up in process listings.
      # mrd.requireReleaseSigning makes the build fail rather than fall back to the debug key.
      - name: Signed release build (R8)
        env:
          MRD_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          MRD_KEYSTORE_PASSWORD: ${{ secrets.MRD_KEYSTORE_PASSWORD }}
          MRD_KEY_ALIAS: ${{ secrets.MRD_KEY_ALIAS }}
          MRD_KEY_PASSWORD: ${{ secrets.MRD_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -Pmrd.requireReleaseSigning=true

      - name: No missing R8 keep rules
        run: |
          dir=app/build/outputs/mapping/release
          if [ ! -s "$dir/mapping.txt" ]; then
            echo "No R8 mapping in $dir: has the release output path changed?"
            exit 1
          fi
          if [ -s "$dir/missing_rules.txt" ]; then
            echo "R8 reported missing keep rules:"
            cat "$dir/missing_rules.txt"
            exit 1
          fi

      # Fails closed: only an APK signed with the upload key (this certificate) may be published.
      - name: Check the APK is signed with the upload key
        env:
          UPLOAD_CERT_SHA256: decc2fe9978efecff2b847afbe919265c01597556cf1c22ce9f6dd63171ad875
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/certs.txt"
          if ! grep -q "certificate SHA-256 digest: $UPLOAD_CERT_SHA256" "$RUNNER_TEMP/certs.txt"; then
            cat "$RUNNER_TEMP/certs.txt"
            echo "The APK isn't signed with the upload key."
            exit 1
          fi

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          apk="mrd-restaurant-discovery-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$TAG" "$apk" --verify-tag --title "$TAG" --generate-notes

      # Kept with the run rather than published: it de-obfuscates crash stack traces from this exact build.
      - name: Upload the R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r8-mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
