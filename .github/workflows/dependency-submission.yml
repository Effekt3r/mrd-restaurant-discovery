name: Dependency submission

# Sends the resolved Gradle dependency graph to GitHub so Dependabot can raise vulnerability alerts for it; GitHub
# can't read Gradle builds on its own. Alerts are computed for the default branch, so this runs on pushes to master;
# the build runs read-only, and only the submit job can write.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate the Gradle dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      # Runs the Gradle build (and any plugin it downloads) with a read-only token, then uploads the graph.
      - name: Generate the dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: generate-and-upload
          cache-provider: basic
          validate-wrappers: true

  submit:
    name: Submit the dependency graph
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can write: it submits the uploaded graph and runs no build code.
    permissions:
      contents: write
    steps:
      # On push and workflow_dispatch the action reads this run's artifact with the runtime token, so it needs no
      # actions: read. No Gradle runs here, so caching is off; unset, the action would start its commercial provider.
      - name: Submit the dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: download-and-submit
          cache-disabled: true
