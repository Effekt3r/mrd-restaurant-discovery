name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]

# Least privilege: jobs can read the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      # Also validates the Gradle wrapper JAR against Gradle's published checksums. The basic cache provider is the
      # open-source one (built on actions/cache). Pushes to dev and master write the cache; pull requests only read it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/master' }}

      - name: Formatting
        run: ./gradlew spotlessCheck

      - name: Lint
        run: ./gradlew :app:lintDebug

      - name: Unit, Robolectric and architecture tests
        run: ./gradlew testDebugUnitTest

      - name: Release build (R8)
        run: ./gradlew :app:assembleRelease

      - name: No missing R8 keep rules
        run: |
          dir=app/build/outputs/mapping/release
          if [ ! -s "$dir/mapping.txt" ]; then
            echo "No R8 mapping in $dir: has the release output path changed?"
            exit 1
          fi
          if [ -s "$dir/missing_rules.txt" ]; then
            echo "R8 reported missing keep rules:"
            cat "$dir/missing_rules.txt"
            exit 1
          fi

      - name: Upload build outputs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-outputs
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/mapping/release/mapping.txt
            **/build/reports/
          if-no-files-found: warn

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .
