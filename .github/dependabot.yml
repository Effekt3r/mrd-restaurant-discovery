version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    # Stability policy: only propose releases that have been out for 30 days.
    cooldown:
      default-days: 30
    open-pull-requests-limit: 5
    groups:
      # AGP, Kotlin, KSP and Hilt have to move together.
      toolchain:
        patterns:
          - "com.android.tools.build*"
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
          - "com.google.dagger*"
      androidx:
        patterns:
          - "androidx.*"
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
    commit-message:
      prefix: ci
